<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Final Fight</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

.b{background:#1c2142;color:#fff;border:2px solid #3a4180;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}

#m{background:linear-gradient(#05060fe6,#0b0d1aee)}#m.title{background:radial-gradient(transparent 30%,#05060fcc);justify-content:flex-start;padding-top:3vh}
.logo{text-align:center;line-height:.82;font-weight:900;font-style:italic;filter:drop-shadow(5px 5px 0 #3a0e06) drop-shadow(0 0 24px #ff5a3caa)}

.card canvas{width:100%;display:block;border-radius:8px}.card b{display:block;margin:4px 0}

.card.map{width:240px}#code{font-size:44px;font-weight:900;letter-spacing:10px;color:#ffd23c;font-family:monospace}.in{background:#0b0d1a;color:#fff;border:2px solid #3a4180;border-radius:8px;padding:10px;font-size:22px;width:170px;text-align:center;letter-spacing:6px;text-transform:uppercase;font-family:monospace}.net{position:absolute;top:10px;right:14px;font-size:12px;opacity:.8;background:#000a;padding:4px 10px;border-radius:6px;pointer-events:none}
</style></head><body><div id="w"><canvas id="c" width="960" height="540"></canvas><div id="m"></div></div>
<script>
const C=document.getElementById('c'),G=C.getContext('2d'),W=960,H=540,M=document.getElementById('m');let g=G;
// ===== CHARACTERS: add your own here. Set img:(an Image) to use a sprite instead of the placeholder drawing =====
const CHARS=[
{n:'Blaze',c:'#ff5a3c',spd:5,jump:12.5,wt:1,pow:1.1,acc:0},
{n:'Frost',c:'#48c8ff',spd:4.3,jump:13,wt:.9,pow:.9,ranged:1,acc:1},
{n:'Verdant',c:'#5be37a',spd:4.6,jump:12,wt:1.2,pow:1,acc:2},
{n:'Volt',c:'#ffd23c',spd:6,jump:13.2,wt:.8,pow:.85,acc:3},
{n:'Angelic',c:'#ffe27a',spd:5,jump:12.5,wt:1.05,pow:1,acc:4,ang:1,ds:'Lunge · Spear · Flight · Light Beam'},
{n:'Fixer',c:'#ff9a2e',spd:4.6,jump:12.5,wt:1,pow:1,acc:5,eng:1,ds:'Random Builds · Guns · Bombs · Blades'},
{n:'Soar',c:'#7fe0c8',spd:5.8,jump:13.5,wt:.85,pow:.9,acc:6,soar:1,ds:'Gale · Talons · Cyclone · Sky Sovereign'}];
// ===== MAPS =====
const MAPS=[
{n:'Skyline',a:'#2a6bd6',b:'#f7a35c',st:0,P:[{x:200,y:400,w:560,m:1},{x:290,y:290,w:130},{x:540,y:290,w:130}]},
{n:'Neon Night',a:'#12062e',b:'#5b1a8f',st:1,P:[{x:150,y:420,w:660,m:1},{x:180,y:310,w:110},{x:425,y:230,w:110},{x:670,y:310,w:110}]},
{n:'Floating Isles',a:'#5fd0c4',b:'#d8f7e8',st:2,P:[{x:340,y:390,w:280,m:1},{x:110,y:300,w:150},{x:700,y:300,w:150},{x:430,y:230,w:100}]}];
const cfg={mode:'cpu',diff:1,map:0,p1:0,p2:1};
let scene='menu',F=[],PR=[],PT=[],shake=0,stop=0,T=0,map=MAPS[0],winner=-1,paused=false,tut=null,page='title',pk=0;

// ===== audio =====
let AC;function snd(f,d=.08,t='square',v=.05){try{AC=AC||new AudioContext();const o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,AC.currentTime);a.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// ===== menus: title, mode, visual character/map select =====

const tg=i=>{const t=(cfg.p1==i?'P1 ':'')+(cfg.p2==i?(cfg.mode=='cpu'?'CPU':'P2'):'');return t?`<span class="tg" style="background:#ffd23c">${t}</span>`:''};
function menu(p){CIN=null,RET=null;if(p)page=p;scene='menu';tut=null;paused=false;M.style.display='flex';M.className=page;map=MAPS[cfg.map];PR=[];
F=page=='title'?[mk(0,cfg.p1,-1),mk(1,cfg.p2,-1)]:[];
const cpu=cfg.mode=='cpu',bk=f=>`<button class="b" onclick="${f}">◀ BACK</button>`;let h='';
if(page=='title')h=`<div class="logo"><div class="l1">FINAL</div><div class="l2">FIGHT</div></div><div class="tag">ARENA BRAWLER</div><div class="r" style="margin-top:16px"><button class="b big" onclick="menu('mode')">▶ PLAY</button><button class="b" onclick="start(1)">🎓 TUTORIAL</button></div><small>Press Enter to start</small>`;
else if(page=='mode')h=`<div class="hd">SELECT MODE</div><div class="cards">${[['1 PLAYER','vs the CPU','cpu'],['2 PLAYERS','same keyboard','2p'],['🌐 ONLINE','vs real people','online']].map(m=>`<div class="card ${cfg.mode==m[2]?'on':''}" style="width:200px;padding:22px" onclick="sm('${m[2]}')"><b style="font-size:20px">${m[0]}</b>${m[1]}</div>`).join('')}</div>`+(cpu?`<div class="r"><span>CPU Level</span>${['Easy','Medium','Hard'].map((d,i)=>`<button class="b ${cfg.diff==i?'on':''}" onclick="sd(${i})">${d}</button>`).join('')}</div>`:'')+`<div class="r">${bk("menu('title')")}<button class="b on" onclick="pk=0;cfg.mode=='online'?menu('online'):menu('chars')">NEXT ▶</button></div><small><b>Move:</b> WASD or arrow keys (1P) · <b>1</b> Dash · <b>2</b> Light · <b>3</b> Heavy · <b>4</b> Projectile · <b>5</b> Ultimate (fill the power bar by fighting)<br><b>2-player:</b> P1 WASD + 1-5 · P2 arrows + J K L ; ' (or Numpad 1-5)</small>`;
else if(page=='online')h=netPage(bk);else if(page=='wait')h=`<div class="hd">${NET.st}</div><small>${CHARS[cfg.p1].n} is ready.</small><div class="r"><button class="b" onclick="netQuit()">✕ LEAVE</button></div>`;else if(page=='chars'){const who=cfg.mode=='online'?'YOU':pk?(cpu?'CPU OPPONENT':'PLAYER 2'):'PLAYER 1';h=`<div class="hd">${who}: CHOOSE YOUR FIGHTER</div><div class="cards">${CHARS.map((c,i)=>`<div class="card ${cfg['p'+(pk+1)]==i?'on':''}" onclick="cp(${i})">${tg(i)}<canvas width="150" height="140" data-ch="${i}"></canvas><b style="color:${c.c}">${c.n}</b>${c.ds?`<small style="display:block;font-size:10px;margin-bottom:4px">${c.ds}</small>`:''}${bars(c)}</div>`).join('')}</div><div class="r">${bk("pk?(pk=0,menu('chars')):menu('mode')")}</div>`}
else h=`<div class="hd">CHOOSE YOUR ARENA</div><div class="cards">${MAPS.map((m,i)=>`<div class="card map ${cfg.map==i?'on':''}" onclick="mp(${i})"><canvas width="240" height="135" data-mp="${i}"></canvas><b>${m.n}</b></div>`).join('')}</div><div style="opacity:.8">${cfg.mode=='online'?(CHARS[cfg.p1].n+' vs '+(NET.och==null?'opponent choosing…':CHARS[NET.och].n)):CHARS[cfg.p1].n+' vs '+(cpu?'CPU ':'')+CHARS[cfg.p2].n}</div><div class="r">${bk(cfg.mode=='online'?"menu('chars')":"pk=1;menu('chars')")}<button id="go" class="b" onclick="cfg.mode=='online'&&NET.och==null?0:start()">⚔ FIGHT!</button></div>`;
M.innerHTML=h}
function sm(m){cfg.mode=m;snd(500,.05);menu('mode')}
function sd(d){cfg.diff=d;snd(500,.05);menu('mode')}
function cp(i){if(cfg.mode=='online'){cfg.p1=i;snd(650,.07,'triangle');netSend({t:'ch',i});if(NET.h){cfg.p2=NET.och??1;menu('maps')}else{NET.st='WAITING FOR HOST TO START…';menu('wait')}return}cfg['p'+(pk+1)]=i;snd(650,.07,'triangle');if(pk==0){pk=1;menu('chars')}else menu('maps')}
function mp(i){cfg.map=i;snd(500,.05);menu('maps')}
// animated title duel
function demo(){F.forEach((f,i)=>{const o=F[1-i];Object.assign(f,{y:map.P[0].y,x:i?610:350,face:i?-1:1,gr:1,inv:0,stun:0,vx:0,vy:0});f.sq*=.8;
if(f.atk){f.at++;if(f.at==(f.atk==1?5:13)){burst(o.x,o.y-34,f.ch.c,14,6,4);o.sq=.3}if(f.at>(f.atk==1?16:34))f.atk=0}
else if((T+i*70)%150==0){f.atk=1+(T/150&1);f.at=0}})}
// live card previews drawn with the same fighter/map renderers
function prev(){M.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d'),a=c.dataset;g=x;x.clearRect(0,0,c.width,c.height);
if(a.ch!=null){const t=(T+a.ch*37)%120;drawF({ch:CHARS[a.ch],x:55,y:128,face:1,dead:0,inv:0,stun:0,vx:0,sq:Math.sin(T*.1)*.03,ph:0,gr:1,atk:t<16?1:t>60&&t<94?2:0,at:t<16?t:t-60})}
else{const sv=map,k=c.width/W;map=MAPS[a.mp];x.save();x.scale(k,k);bg();plat();x.restore();map=sv}});g=G}
// ===== interactive tutorial =====
function tutChk(){const f=F[0],d=F[1],t=tut;if(t.cd>0){t.cd--;return}
const ok=[()=>(t.v+=Math.abs(f.vx))>500,()=>!f.gr&&f.jumps<2,()=>!f.gr&&f.jumps==0,()=>f.dash>0,()=>f.atk==1,()=>f.atk==2,()=>f.atk==3,()=>f.drop>0,()=>d.dmg>=50,()=>f.atk==5,()=>d.dead>0][t.s];
if(ok&&ok()){t.s++;if(t.s==9)f.mp=100;t.cd=45;snd(880,.15,'triangle');burst(f.x,f.y-40,'#7dff9a',20,6,4)}}
function tutDraw(){const t=tut,n=TUT.length;g.fillStyle='#000c';g.beginPath();g.roundRect(W/2-310,14,620,80,14);g.fill();g.strokeStyle='#ffd23c';g.lineWidth=2;g.stroke();g.textAlign='center';
if(t.s>=n){g.fillStyle='#7dff9a';g.font='900 28px system-ui';g.fillText('TUTORIAL COMPLETE!',W/2,52);g.fillStyle='#fff';g.font='15px system-ui';g.fillText('Esc: back to menu, then go fight!',W/2,78);return}
g.fillStyle='#ffd23c';g.font='900 22px system-ui';g.fillText(`${t.s+1}/${n}  ${TUT[t.s][0]}`,W/2,46);g.fillStyle='#fff';g.font='16px system-ui';g.fillText(TUT[t.s][1],W/2,70);
for(let i=0;i<n;i++){g.fillStyle=i<t.s?'#7dff9a':i==t.s?'#ffd23c':'#555';g.beginPath();g.arc(W/2-(n-1)*9+i*18,84,4,0,6.3);g.fill()}
g.fillStyle='#fff9';g.font='13px system-ui';g.fillText('Esc: exit tutorial',W/2,H-14)}

// ===== game setup =====
function mk(i,ch,ai){const s=map.P[0];return{i,ch:CHARS[ch],x:s.x+s.w*(i?.7:.3),y:s.y-300,vx:0,vy:0,face:i?-1:1,dmg:0,fly:0,dh:0,bld:null,uses:0,em:null,edur:0,edm:0,pop:null,lastb:-1,sk:0,mp:0,cd1:0,cd4:0,dash:0,st:3,jumps:2,gr:0,atk:0,at:0,hit:0,stun:0,inv:90,sq:0,ph:0,drop:0,dead:0,ai,hold:{},pr:{},dec:0,cool:0,tgt:0}}
function start(t){if(NET&&!NET.h&&!t)return netSend({t:'re'});if(NET&&t)netQuit(1);if(NET)cfg.p2=NET.och;tut=t?{s:0,v:0,cd:40}:null;map=bigMap(MAPS[t?0:cfg.map]);CIN=null;CZ=.7;CX=WW/2;CY=WH/2;F=[mk(0,cfg.p1,-1),mk(1,t?2:cfg.p2,t?-2:cfg.mode=='online'?-3:cfg.mode=='cpu'?cfg.diff:-1)];if(t)F.forEach(f=>f.st=99);PR=[];PT=[];winner=-1;paused=false;M.style.display='none';scene='play';snd(300,.2,'sawtooth')}
let FL=0,EX=[];const WW=1536,WH=756,SX=1.6,SY=1.4;let CZ=.8,CX=WW/2,CY=WH/2,CIN=null;function keyAct(c){const solo=F[1]&&F[1].ai!=-1,n='mahsu',d=c.startsWith('Digit')?+c[5]:c.startsWith('Numpad')&&c.length==7?+c[6]:0;
if(d>=1&&d<=5)return[c[0]=='D'||solo?0:1,n[d-1]];
return{KeyW:[0,'j'],ArrowUp:[solo?0:1,'j'],KeyJ:[1,'m'],KeyK:[1,'a'],KeyL:[1,'h'],Semicolon:[1,'s'],Quote:[1,'u']}[c]}
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;
if(NET&&(scene=='play'||scene=='over')&&e.code=='Escape'){netQuit();return}if(scene=='play'&&e.code=='Escape'){if(tut)menu('title');else paused=!paused}else if(scene=='over'){if(e.code=='Enter')start();if(e.code=='Escape')menu('title')}else if(scene=='menu'&&page=='title'&&e.code=='Enter')menu('mode');
const m=keyAct(e.code);
if(m&&NET&&!NET.h){if(scene=='play')netSend({t:'p',k:m[1]})}else if(m&&scene=='play'&&F[m[0]]&&F[m[0]].ai==-1)F[m[0]].pr[m[1]]=1;
if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
// ===== particles =====
function burst(x,y,c,n,sp=5,s=4){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:20+Math.random()*20,m:40,c,s:s*(.5+Math.random())})}}
// ===== AI =====
function onStage(f){return map.P.some(p=>f.x>p.x-5&&f.x<p.x+p.w+5&&f.y<=p.y+2)}
function think(f,o){const d=f.ai,h=f.hold,dx=o.x-f.x,ad=Math.abs(dx),dy=o.y-f.y,mp=map.P[0],cx=mp.x+mp.w/2;
h.l=h.r=h.d=h.u=0;f.cool--;if(f.mp>=100&&f.stun<=0&&!f.atk&&o.dead<=0&&ad<(f.ch.ang||f.ch.eng||f.ch.soar?520:170)&&Math.random()<[.04,.07,.12][d]){f.face=dx>0?1:-1;f.pr.u=1}
if(f.dec--<=0){f.dec=[16,8,3][d];f.tgt=Math.random()}
// recovery
const off=f.x<mp.x-10||f.x>mp.x+mp.w+10||f.y>mp.y+60;
if(off&&f.stun<=0){h[f.x<cx?'r':'l']=1;h.u=f.y>mp.y;if(d>0&&f.cd1<=0&&f.jumps==0&&Math.random()<.08)f.pr.m=1;if(f.ch.ang&&f.fly<=0&&f.cd4<=0&&d>0)f.pr.s=1;if(f.vy>-1&&f.jumps>0&&f.y>mp.y-20&&Math.random()<[.03,.1,.5][d])f.pr.j=1;
if(f.ch.ranged==undefined&&f.y>mp.y+20&&f.jumps==0&&d==2&&0)f.pr.s=1;return}
if(o.dead>0){h[f.x<cx?'r':'l']=ad>40?1:0;return}
const want=f.ch.ranged&&d>0?170:44;
if(ad>want+8)h[dx>0?'r':'l']=1;else if(ad<want-30&&f.ch.ranged)h[dx>0?'l':'r']=1;
if(f.stun<=0)f.face=dx>0?1:-1;
// don't walk off edges (medium/hard)
if(d>0&&f.gr){const nx=f.x+(h.r?30:h.l?-30:0);if(!map.P.some(p=>nx>p.x&&nx<p.x+p.w&&Math.abs(p.y-f.y)<6)&&!(dy<-60)){h.l=h.r=0}}
// platform chasing
if(dy<-70&&f.gr&&f.tgt<[.02,.06,.15][d])f.pr.j=1;
if(dy>70&&f.gr&&d>0&&f.tgt<.3){h.d=1}
if(f.atk==0&&f.stun<=0&&f.cool<=0&&f.tgt<[.35,.65,.95][d]){
if(ad<60&&Math.abs(dy)<50){f.cool=[40,22,10][d];(Math.random()<(d?.3:.1)?f.pr.h=1:f.pr.a=1)}
else if(f.ch.ranged&&ad<420&&Math.abs(dy)<45&&d>0){f.pr.s=1;f.cool=50}}
if(f.ch.eng&&f.stun<=0&&!f.atk){const rg=f.bld&&f.bld.a.k=='melee'?110:300;if(!f.bld&&ad>100)f.pr.s=1;else if(f.bld&&f.cool<=0&&ad<rg&&Math.abs(dy)<70){f.pr[Math.random()<.35?'h':'a']=1;f.cool=[45,26,14][d]}}
if(f.ch.soar&&f.stun<=0&&!f.atk){if(f.cool<=0&&ad<320&&Math.abs(dy)<200&&Math.random()<[.02,.04,.07][d]){f.pr[ad>110?'h':'a']=1;f.cool=40}if(f.cd4<=0&&ad>90&&ad<340&&d>0&&Math.random()<.03)f.pr.s=1}
if(f.ch.ang&&d>0&&f.cd1<=0&&ad>90&&ad<230&&Math.abs(dy)<40&&f.tgt<.3)f.pr.m=1;if(f.mp>=100&&ad<150&&d>0&&f.stun<=0&&f.atk==0)f.pr.u=1;if(d==2&&f.gr==0&&f.vy>0&&o.y<f.y-40&&Math.random()<.1&&f.jumps>0&&ad<80)f.pr.j=1}
