<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Final Fight</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#w{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;background:#000;border-radius:8px;box-shadow:0 0 40px #0008}

h1{margin:0;font-size:clamp(40px,8vw,84px);letter-spacing:6px;font-style:italic;background:linear-gradient(90deg,#ff5a3c,#ffd23c,#48c8ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:p 2s ease-in-out infinite;filter:drop-shadow(0 0 14px #ff5a3c88)}

.b{background:#1c2142;color:#fff;border:2px solid #3a4180;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
.b:hover{transform:translateY(-2px)}.b.on{background:var(--ac);border-color:#ffd23c;box-shadow:0 0 14px var(--ac)}
#go{font-size:22px;padding:12px 40px;margin-top:6px;background:#ffd23c;color:#111;border-color:#fff}

.card:hover{transform:translateY(-6px) scale(1.04);border-color:#fff}.card.on{border-color:#ffd23c;box-shadow:0 0 20px #ffd23caa}
.card canvas{width:100%;display:block;border-radius:8px}.card b{display:block;margin:4px 0}

.card.map{width:240px}#code{font-size:44px;font-weight:900;letter-spacing:10px;color:#ffd23c;font-family:monospace}.in{background:#0b0d1a;color:#fff;border:2px solid #3a4180;border-radius:8px;padding:10px;font-size:22px;width:170px;text-align:center;letter-spacing:6px;text-transform:uppercase;font-family:monospace}.net{position:absolute;top:10px;right:14px;font-size:12px;opacity:.8;background:#000a;padding:4px 10px;border-radius:6px;pointer-events:none}
</style></head><body><div id="w"><canvas id="c" width="960" height="540"></canvas><div id="m"></div></div>
<script>
const C=document.getElementById('c'),G=C.getContext('2d'),W=960,H=540,M=document.getElementById('m');let g=G;

{n:'Cutter',c:'#ff4d6d',spd:5.6,jump:13,wt:.9,pow:1,acc:9,bc:'#8a1f3a',cut:1,ds:'Twin Blades · Trip Dash · X-Slash · Thousand Cuts'},

{n:'Swamped',c:'#8aa83a',spd:4.4,jump:12,wt:1.25,pow:1.05,acc:9,bc:'#4a6a22',ds:'Slows · Stuns · Traps · Drowning Swamp'}];

{n:'Skyline',a:'#2a6bd6',b:'#f7a35c',st:0,P:[{x:200,y:400,w:560,m:1},{x:290,y:290,w:130},{x:540,y:290,w:130}]},

{n:'Floating Isles',a:'#5fd0c4',b:'#d8f7e8',st:2,P:[{x:340,y:390,w:280,m:1},{x:110,y:300,w:150},{x:700,y:300,w:150},{x:430,y:230,w:100}]}];

const TUT=[['Move','Hold A / D (or ← / →) to run'],['Jump','Press W (or ↑) to jump'],['Double Jump','Press W again in mid-air'],['Dash','Press 1 for your movement ability (W + 1 dashes upward)'],['Light Attack','Press 2'],['Heavy Attack','Press 3 for a powerful smash'],['Projectile','Press 4 to fire a projectile'],['Drop Through','Jump onto a floating platform, then press S'],['Hit the Dummy','Land hits until it reaches 50% — hits fill your power bar!'],['Ultimate','Power bar full! Press 5 to unleash your ultimate'],['Get the KO','Launch the dummy off the stage! Higher % = farther flight']];

const tg=i=>{const t=(cfg.p1==i?'P1 ':'')+(cfg.p2==i?(cfg.mode=='cpu'?'CPU':'P2'):'');return t?`<span class="tg" style="background:#ffd23c">${t}</span>`:''};
function menu(p){CIN=null;RET=null;SPC=null;PETS=[];DOM=null;if(p)page=p;scene='menu';tut=null;paused=false;M.style.display='flex';M.className=page;map=MAPS[cfg.map];PR=[];
F=page=='title'?[mk(0,cfg.p1,-1),mk(1,cfg.p2,-1)]:[];
const cpu=cfg.mode=='cpu',bk=f=>`<button class="b" onclick="${f}">◀ BACK</button>`;let h='';
if(page=='title')h=`<div class="logo"><div class="l1">FINAL</div><div class="l2">FIGHT</div></div><div class="tag">ARENA BRAWLER</div><div class="r" style="margin-top:16px"><button class="b big" onclick="menu('mode')">▶ PLAY</button><button class="b" onclick="start(1)">🎓 TUTORIAL</button></div><small>Press Enter to start</small>`;
else if(page=='mode')h=`<div class="hd">SELECT MODE</div><div class="cards">${[['1 PLAYER','vs the CPU','cpu'],['2 PLAYERS','same keyboard','2p'],['🌐 ONLINE','vs real people','online']].map(m=>`<div class="card ${cfg.mode==m[2]?'on':''}" style="width:200px;padding:22px" onclick="sm('${m[2]}')"><b style="font-size:20px">${m[0]}</b>${m[1]}</div>`).join('')}</div>`+(cpu?`<div class="r"><span>CPU Level</span>${['Easy','Medium','Hard'].map((d,i)=>`<button class="b ${cfg.diff==i?'on':''}" onclick="sd(${i})">${d}</button>`).join('')}</div>`:'')+`<div class="r">${bk("menu('title')")}<button class="b on" onclick="pk=0;cfg.mode=='online'?menu('online'):menu('chars')">NEXT ▶</button></div><small><b>Move:</b> WASD or arrow keys (1P) · <b>1</b> Dash · <b>2</b> Light · <b>3</b> Heavy · <b>4</b> Projectile · <b>5</b> Ultimate (fill the power bar by fighting)<br><b>2-player:</b> P1 WASD + 1-5 · P2 arrows + J K L ; ' (or Numpad 1-5)</small>`;
else if(page=='online')h=netPage(bk);else if(page=='wait')h=`<div class="hd">${NET.st}</div><small>${CHARS[cfg.p1].n} is ready.</small><div class="r"><button class="b" onclick="netQuit()">✕ LEAVE</button></div>`;else if(page=='chars'){const who=cfg.mode=='online'?'YOU':pk?(cpu?'CPU OPPONENT':'PLAYER 2'):'PLAYER 1';h=`<div class="hd">${who}: CHOOSE YOUR FIGHTER</div><div class="cards">${CHARS.map((c,i)=>`<div class="card ${cfg['p'+(pk+1)]==i?'on':''}" onclick="cp(${i})">${tg(i)}<canvas width="150" height="140" data-ch="${i}"></canvas><b style="color:${c.c}">${c.n}</b>${c.ds?`<small style="display:block;font-size:10px;margin-bottom:4px">${c.ds}</small>`:''}${bars(c)}</div>`).join('')}</div><div class="r">${bk("pk?(pk=0,menu('chars')):menu('mode')")}</div>`}
else h=`<div class="hd">CHOOSE YOUR ARENA</div><div class="cards">${MAPS.map((m,i)=>`<div class="card map ${cfg.map==i?'on':''}" onclick="mp(${i})"><canvas width="240" height="135" data-mp="${i}"></canvas><b>${m.n}</b></div>`).join('')}</div><div style="opacity:.8">${cfg.mode=='online'?(CHARS[cfg.p1].n+' vs '+(NET.och==null?'opponent choosing…':CHARS[NET.och].n)):CHARS[cfg.p1].n+' vs '+(cpu?'CPU ':'')+CHARS[cfg.p2].n}</div><div class="r">${bk(cfg.mode=='online'?"menu('chars')":"pk=1;menu('chars')")}<button id="go" class="b" onclick="cfg.mode=='online'&&NET.och==null?0:start()">⚔ FIGHT!</button></div>`;
M.innerHTML=h}
function sm(m){cfg.mode=m;snd(500,.05);menu('mode')}
function sd(d){cfg.diff=d;snd(500,.05);menu('mode')}
function cp(i){if(cfg.mode=='online'){cfg.p1=i;snd(650,.07,'triangle');netSend({t:'ch',i});if(NET.h){cfg.p2=NET.och??1;menu('maps')}else{NET.st='WAITING FOR HOST TO START…';menu('wait')}return}cfg['p'+(pk+1)]=i;snd(650,.07,'triangle');if(pk==0){pk=1;menu('chars')}else menu('maps')}
function mp(i){cfg.map=i;snd(500,.05);menu('maps')}
// animated title duel
function demo(){F.forEach((f,i)=>{const o=F[1-i];Object.assign(f,{y:map.P[0].y,x:i?610:350,face:i?-1:1,gr:1,inv:0,stun:0,vx:0,vy:0});f.sq*=.8;
if(f.atk){f.at++;if(f.at==(f.atk==1?5:13)){burst(o.x,o.y-34,f.ch.c,14,6,4);o.sq=.3}if(f.at>(f.atk==1?16:34))f.atk=0}
else if((T+i*70)%150==0){f.atk=1+(T/150&1);f.at=0}})}
// live card previews drawn with the same fighter/map renderers
function prev(){M.querySelectorAll('canvas').forEach(c=>{const x=c.getContext('2d'),a=c.dataset;g=x;x.clearRect(0,0,c.width,c.height);
if(a.ch!=null){const t=(T+a.ch*37)%120;drawF({ch:CHARS[a.ch],x:55,y:128,face:1,dead:0,inv:0,stun:0,vx:0,sq:Math.sin(T*.1)*.03,ph:0,gr:1,atk:t<16?1:t>60&&t<94?2:0,at:t<16?t:t-60})}
else{const sv=map,k=c.width/W;map=MAPS[a.mp];x.save();x.scale(k,k);bg();plat();x.restore();map=sv}});g=G}
// ===== interactive tutorial =====
const TK={
Blaze:[['Fire Dash','Press 1 to dash with flames','m'],['Flame Jab','Press 2 for fast jabs','a'],['Inferno Uppercut','Press 3 to launch enemies upward','h'],['Fireball','Press 4 for an exploding fireball','s']],
Frost:[['Ice Slide','Press 1 to slide forward','m'],['Ice Shards','Press 2 to fire three shards','a'],['Glacier Slam','Press 3 to freeze enemies briefly','h'],['Blizzard Orb','Press 4 for a slow piercing orb','s']],
Verdant:[['Root Rush','Press 1 to charge','m'],['Thorn Whip','Press 2 for long reach','a'],['Bramble Slam','Press 3 hits both sides','h'],['Seed Bomb','Press 4 to lob a bomb','s']],
Volt:[['Lightning Step','Press 1 for a super-fast dash','m'],['Spark Jab','Press 2 for rapid jabs','a'],['Thunder Palm','Press 3 to stun','h'],['Chain Bolt','Press 4 for twin bolts','s']],
Angelic:[['Lunge','Press 1 to lunge spear-first','m'],['Spear Jab','Press 2','a'],['Staff Slam','Press 3 for 45 damage','h'],['Fly','Press 4 to fly (W / S to climb and descend)',f=>f.fly>0]],
Fixer:[['Build!','Press 4 to build a random weapon',f=>!!f.bld],['Movement','Press 1 (depends on your build)','m'],['Light','Press 2','a'],['Heavy','Press 3','h']],
Soar:[['Glide','Jump, then hold W / ↑ while falling',f=>!f.gr&&f.hold.u&&f.vy>0&&f.vy<3.2],['Gale Dash','Press 1','m'],['Talon Slash','Press 2','a'],['Hawk Dive','Press 3','h'],['Cyclone','Press 4 to pull the enemy into a tornado','s']],
Fracture:[['Blink','Press 1 to teleport where you hold','m'],['Cosmic Fists','Press 2 for a punch barrage','a'],['Nova Blast','Press 3 for a point-blank blast','h'],['Alien Bombs','Press 4 to throw two bombs','s']],
Cutter:[['Trip Dash','Press 1 to dash and trip them','m'],['Slash','Press 2','a'],['X-Slash','Press 3 for 42 damage','h'],['Blade Frenzy','Press 4 for a damage + speed buff',f=>f.buff>0]],
Zookeeper:[['Summon','Press 4 to summon a random animal',f=>PETS.some(q=>q.o==f)],['Whip Command','Press 2: crack the whip and send pets in','a'],['Cage Drop','Press 3 to cage the enemy','h'],['Cheetah Sprint','Press 1','m']],
Swamped:[['Mud Dash','Press 1: dash and leave a slowing bog','m'],['Slime Glob','Press 2 to slow the enemy','a'],['Quagmire Slam','Press 3 to slow and stun','h'],['Set a Trap','Press 4 to place a random trap','s']]};
function tutSteps(ch){return[['Move','Hold A / D (or ← / →) to run',(f,t)=>(t.v+=Math.abs(f.vx))>500],['Jump','Press W (or ↑) to jump',f=>!f.gr&&f.jumps<2],['Double Jump','Press W again in mid-air',f=>!f.gr&&f.jumps<=(ch.soar?1:0)],
...(TK[ch.n]||[]),['Drop Through','Jump onto a floating platform, then press S',f=>f.drop>0],['Hit the Dummy','Land hits until it reaches 50%. Hits fill your power bar!',(f,t,d)=>d.dmg>=50],['Ultimate','Power bar full! Press 5 to unleash your ultimate',f=>f.atk==5],['Get the KO','Launch the dummy off the stage! Higher % = farther flight',(f,t,d)=>d.dead>0]]}
function tutChk(){const f=F[0],d=F[1],t=tut;if(!t.st)return;if(t.cd>0){t.cd--;return}const st=t.st[t.s];if(!st)return;const c=st[2];
if(typeof c=='string'?t.k[c]:c(f,t,d)){t.s++;t.k={};const n=t.st[t.s];if(n&&n[0]=='Ultimate')f.mp=100;t.cd=45;snd(880,.15,'triangle');burst(f.x,f.y-40,'#7dff9a',20,6,4)}}
function tutDraw(){const t=tut,n=t.st.length;g.fillStyle='#000c';g.beginPath();g.roundRect(W/2-310,14,620,80,14);g.fill();g.strokeStyle='#ffd23c';g.lineWidth=2;g.stroke();g.textAlign='center';
if(t.s>=n){g.fillStyle='#7dff9a';g.font='900 28px system-ui';g.fillText('TUTORIAL COMPLETE!',W/2,52);g.fillStyle='#fff';g.font='15px system-ui';g.fillText('Esc: back to menu, then go fight!',W/2,78);return}
g.fillStyle='#ffd23c';g.font='900 22px system-ui';g.fillText(`${t.s+1}/${n}  ${t.st[t.s][0]}`,W/2,46);g.fillStyle='#fff';g.font='16px system-ui';g.fillText(t.st[t.s][1],W/2,70);
for(let i=0;i<n;i++){g.fillStyle=i<t.s?'#7dff9a':i==t.s?'#ffd23c':'#555';g.beginPath();g.arc(W/2-(n-1)*7+i*14,84,3.5,0,6.3);g.fill()}
g.fillStyle='#fff9';g.font='13px system-ui';g.fillText(ch0()+' tutorial · Esc: exit',W/2,H-14)}
function ch0(){return F[0]?F[0].ch.n:''}
// ===== game setup =====
function mk(i,ch,ai){const s=map.P[0];return{i,ch:CHARS[ch],x:s.x+s.w*(i?.7:.3),y:s.y-300,vx:0,vy:0,face:i?-1:1,dmg:0,fly:0,dh:0,bld:null,uses:CHARS[ch].kit?1e9:0,em:null,edur:0,edm:0,pop:null,lastb:-1,sk:0,slow:0,root:0,rally:0,us3:0,hole:0,fk:0,frz:0,lock:0,cutT:0,buff:0,us:0,us2:0,etr:0,mp:0,cd1:0,cd4:0,dash:0,st:3,jumps:2,gr:0,atk:0,at:0,hit:0,stun:0,inv:90,sq:0,ph:0,drop:0,dead:0,ai,hold:{},pr:{},dec:0,cool:0,tgt:0}}
function start(t){if(NET&&!NET.h&&!t)return netSend({t:'re'});if(NET&&t)netQuit(1);if(NET){cfg.p2=NET.och;if(NET.rk){NET.mid=rcode()+rcode()+Date.now().toString(36);netSend({t:'mid',m:NET.mid})}}tut=t?{s:0,v:0,cd:40}:null;map=bigMap(MAPS[t?0:cfg.map]);CIN=null;SPC=null;PETS=[];DOM=null;CZ=.7;CX=WW/2;CY=WH/2;F=[mk(0,cfg.p1,-1),mk(1,t?2:cfg.p2,t?-2:cfg.mode=='online'?-3:cfg.mode=='cpu'?cfg.diff:-1)];if(t){F.forEach(f=>f.st=99);tut.k={};tut.st=tutSteps(F[0].ch)}PR=[];PT=[];winner=-1;paused=false;M.style.display='none';scene='play';snd(300,.2,'sawtooth')}
let FL=0,EX=[];const WW=1536,WH=756,SX=1.6,SY=1.4;let CZ=.8,CX=WW/2,CY=WH/2,CIN=null,RET=null;function keyAct(c){const solo=F[1]&&F[1].ai!=-1,n='mahsu',d=c.startsWith('Digit')?+c[5]:c.startsWith('Numpad')&&c.length==7?+c[6]:0;
if(d>=1&&d<=5)return[c[0]=='D'||solo?0:1,n[d-1]];
return{KeyW:[0,'j'],ArrowUp:[solo?0:1,'j'],KeyJ:[1,'m'],KeyK:[1,'a'],KeyL:[1,'h'],Semicolon:[1,'s'],Quote:[1,'u']}[c]}
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;
if(NET&&(scene=='play'||scene=='over')&&e.code=='Escape'){netQuit();return}if(scene=='play'&&e.code=='Escape'){if(tut)menu('title');else paused=!paused}else if(scene=='over'){if(e.code=='Enter')start();if(e.code=='Escape')menu('title')}else if(scene=='menu'&&page=='title'&&e.code=='Enter')menu('mode');
const m=keyAct(e.code);
if(m&&NET&&!NET.h){if(scene=='play')netSend({t:'p',k:m[1]})}else if(m&&scene=='play'&&F[m[0]]&&F[m[0]].ai==-1)F[m[0]].pr[m[1]]=1;if(tut&&tut.k&&m&&m[0]==0)tut.k[m[1]]=1;
if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
// ===== particles =====
