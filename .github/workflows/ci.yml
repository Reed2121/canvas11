name: CI & GitHub Pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - name: Lint
        run: bun run lint
        continue-on-error: true
      - name: Type check
        run: bunx tsc --noEmit
      - name: Tests
        run: bun run test --passWithNoTests
      - name: Build site
        run: bun run build
      - name: Prepare game for GitHub Pages
        run: |
          mkdir -p pages
          cp -r public/* pages/
          cp public/game.html pages/index.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
