name: CI & GitHub Pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Lint
        run: bun run lint
        continue-on-error: true
      - name: Type check
        run: bunx tsc --noEmit
        continue-on-error: true
      - name: Tests
        run: bunx vitest run --passWithNoTests
        continue-on-error: true
      - name: Build site
        run: bun run build

  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare GitHub Page
        run: |
          mkdir -p pages
          cp -r public/* pages/
          cp .github/pages/index.html pages/index.html
          cp public/game.html pages/play.html
          cp pages/index.html pages/404.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
